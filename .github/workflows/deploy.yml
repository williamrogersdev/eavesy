name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Verify and deploy
    if: vars.VITE_CLERK_PUBLISHABLE_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      EAVESY_D1_DATABASE_ID: ${{ vars.EAVESY_D1_DATABASE_ID }}
      EAVESY_KV_CACHE_ID: ${{ vars.EAVESY_KV_CACHE_ID }}
      EAVESY_APP_DOMAIN: ${{ vars.EAVESY_APP_DOMAIN }}
      EAVESY_WWW_DOMAIN: ${{ vars.EAVESY_WWW_DOMAIN }}
      EAVESY_MCP_DOMAIN: ${{ vars.EAVESY_MCP_DOMAIN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check deploy configuration
        env:
          CLERK_PK: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Secret CLOUDFLARE_API_TOKEN is not set (docs/DEPLOY.md)"; missing=1; fi
          for v in CLOUDFLARE_ACCOUNT_ID EAVESY_D1_DATABASE_ID EAVESY_KV_CACHE_ID EAVESY_APP_DOMAIN; do
            if [ -z "$(printenv $v)" ]; then echo "::error::Variable $v is not set (docs/SELF_HOSTING.md)"; missing=1; fi
          done
          if [ -z "$CLERK_PK" ]; then echo "::error::Variable VITE_CLERK_PUBLISHABLE_KEY is not set (docs/DEPLOY.md)"; missing=1; fi
          exit $missing

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: |
          (cd web && bun install --frozen-lockfile)
          (cd workers/processing && bun install --frozen-lockfile)
          (cd workers/mcp && bun install --frozen-lockfile)

      - name: Render Wrangler configs
        run: node scripts/render-wrangler.mjs

      - name: Write web/.env.production
        env:
          CLERK_PK: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
          MAC_DMG_URL: ${{ vars.VITE_MAC_DMG_URL }}
        run: |
          {
            echo "VITE_CLERK_PUBLISHABLE_KEY=$CLERK_PK"
            echo "VITE_APP_URL=https://$EAVESY_APP_DOMAIN"
            echo "VITE_CLERK_SIGN_IN_URL=/sign-in"
            echo "VITE_CLERK_SIGN_UP_URL=/sign-up"
            echo "VITE_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL=/app"
            echo "VITE_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL=/app"
            if [ -n "$MAC_DMG_URL" ]; then echo "VITE_MAC_DMG_URL=$MAC_DMG_URL"; fi
          } > web/.env.production

      - name: Build
        working-directory: web
        run: bun run build
      - name: Typecheck
        run: |
          (cd web && bunx tsc --noEmit)
          (cd workers/processing && bunx tsc --noEmit)
          (cd workers/mcp && bunx tsc --noEmit)
      - name: Lint
        working-directory: web
        run: bunx eslint .
      - name: Test
        working-directory: web
        run: bun test src
      - name: Worker tests
        working-directory: web
        run: bun run test:workers
      - name: Two-track bench
        working-directory: web
        run: bun bench/score.ts --check

      - name: Apply D1 migrations
        run: bun run db:apply:remote

      - name: Deploy processing Worker
        run: bun run deploy:processing
      - name: Deploy MCP Worker
        run: bun run deploy:mcp
      - name: Deploy web Worker
        run: bun run deploy

      - name: Smoke test
        id: smoke
        run: |
          check() {
            local url=$1 status
            for attempt in 1 2 3 4 5; do
              status=$(curl -s -o /tmp/body -w '%{http_code}' "$url" || echo 000)
              if [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then
                echo "ok $status $url"
                return 0
              fi
              sleep 5
            done
            echo "::error::$url returned $status"
            return 1
          }
          APP=https://$EAVESY_APP_DOMAIN
          check $APP
          if [ -n "$EAVESY_WWW_DOMAIN" ]; then check https://$EAVESY_WWW_DOMAIN; fi
          if [ -n "$EAVESY_MCP_DOMAIN" ]; then check https://$EAVESY_MCP_DOMAIN; fi
          check $APP/download/mac
          check $APP/sign-in
          if grep -q "Authentication isn" /tmp/body; then
            echo "::error::/sign-in says authentication isn't configured"
            exit 1
          fi

      - name: Roll back web Worker
        if: failure() && steps.smoke.outcome == 'failure'
        working-directory: web
        run: |
          ../scripts/cf bunx wrangler rollback --yes --message "auto-rollback: smoke test failed on ${GITHUB_SHA::7}"
