name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the release workflow start CI on a branch it pushed (pushes made with
  # GITHUB_TOKEN start no workflows on their own).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  # Decides which of the two required jobs this change needs. A job skipped by
  # its `if` still reports success, so both required checks always resolve;
  # if this job itself fails, both run.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          printf '%s\n' "$files"
          web=false
          desktop=false
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            [[ "$f" != */* && "$f" == *.md ]] && continue
            case "$f" in
              .github/workflows/ci.yml) web=true; desktop=true ;;
              desktop/*) desktop=true ;;
              docs/*|packaging/*|plugins/*|LICENSE|NOTICE) ;;
              .github/ISSUE_TEMPLATE/*|.github/CODEOWNERS|.github/dependabot.yml) ;;
              .github/workflows/macos-release.yml|.github/workflows/release-desktop.yml|.github/workflows/tag-desktop-release.yml) ;;
              *) web=true ;;
            esac
          done <<< "$files"
          echo "web=$web" | tee -a "$GITHUB_OUTPUT"
          echo "desktop=$desktop" | tee -a "$GITHUB_OUTPUT"

  web:
    name: Web + Workers
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install
        run: |
          (cd web && bun install --frozen-lockfile)
          (cd workers/processing && bun install --frozen-lockfile)
          (cd workers/mcp && bun install --frozen-lockfile)
      - name: Check migration numbering
        run: scripts/check-migrations.sh
      - name: Write placeholder env for the build
        # VITE_* values are baked in at build time and web/.env.production is not
        # tracked. PR builds only need a well-formed key; deploy.yml writes the
        # real one from repository variables.
        run: |
          {
            echo "VITE_CLERK_PUBLISHABLE_KEY=pk_test_cGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA"
            echo "VITE_APP_URL=https://eavesy.com"
          } > web/.env.production
      # Build must run before typecheck: it generates src/routeTree.gen.ts
      # (gitignored), which tsc needs to resolve the route tree types.
      - name: Build
        working-directory: web
        run: bun run build
      - name: Typecheck
        run: |
          (cd web && bunx tsc --noEmit)
          (cd workers/processing && bunx tsc --noEmit)
          (cd workers/mcp && bunx tsc --noEmit)
      - name: Lint
        working-directory: web
        run: bunx eslint . --max-warnings 0
      - name: Test
        working-directory: web
        run: bun test src
      - name: Worker tests
        working-directory: web
        run: bun run test:workers
      - name: Two-track bench
        working-directory: web
        run: bun bench/score.ts --check
      - name: Bundle workers
        run: |
          (cd workers/processing && bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/processing")
          (cd workers/mcp && bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/mcp")

  desktop:
    name: Desktop (Rust + Swift)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.desktop == 'true') }}
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      # Only main saves the cache, so PR runs restore main's warm cache
      # instead of each branch storing (and evicting) its own copy.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prebuild
        run: desktop/scripts/prebuild.sh
      - name: Swift tests
        working-directory: desktop/swift-audio
        run: swift test
      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked -- -D warnings
