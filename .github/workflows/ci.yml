name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web + Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install
        run: |
          (cd web && bun install --frozen-lockfile)
          (cd workers/processing && bun install --frozen-lockfile)
          (cd workers/mcp && bun install --frozen-lockfile)
          (cd cli && bun install --frozen-lockfile)
      - name: Check migration numbering
        run: scripts/check-migrations.sh
      - name: Write placeholder env for the build
        # VITE_* values are baked in at build time and web/.env.production is not
        # tracked. PR builds only need a well-formed key; deploy.yml writes the
        # real one from repository variables.
        run: |
          {
            echo "VITE_CLERK_PUBLISHABLE_KEY=pk_test_cGxhY2Vob2xkZXIuY2xlcmsuYWNjb3VudHMuZGV2JA"
            echo "VITE_APP_URL=https://eavesy.com"
          } > web/.env.production
      # Build must run before typecheck: it generates src/routeTree.gen.ts
      # (gitignored), which tsc needs to resolve the route tree types.
      - name: Build
        working-directory: web
        run: bun run build
      - name: Typecheck
        run: |
          (cd web && bunx tsc --noEmit)
          (cd workers/processing && bunx tsc --noEmit)
          (cd workers/mcp && bunx tsc --noEmit)
      - name: Lint
        working-directory: web
        run: bunx eslint . --max-warnings 0
      - name: Test
        working-directory: web
        run: bun test src
      - name: Worker tests
        working-directory: web
        run: bun run test:workers
      - name: CLI
        working-directory: cli
        run: |
          bunx tsc --noEmit
          bun test
          bun run build
          node dist/eavesy.js recent --root test/fixtures/Recordings
      - name: Two-track bench
        working-directory: web
        run: bun bench/score.ts --check
      - name: Bundle workers
        run: |
          (cd workers/processing && bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/processing")
          (cd workers/mcp && bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/mcp")

  desktop:
    name: Desktop (Rust + Swift)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop/src-tauri
      - name: Prebuild
        run: desktop/scripts/prebuild.sh
      - name: Swift tests
        working-directory: desktop/swift-audio
        run: swift test
      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy --locked -- -D warnings
