name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web + Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: |
          (cd web && bun install --frozen-lockfile)
          (cd workers/processing && bun install --frozen-lockfile)
          (cd workers/mcp && bun install --frozen-lockfile)
      - name: Build
        working-directory: web
        run: bun run build
      - name: Typecheck
        run: |
          (cd web && bunx tsc --noEmit)
          (cd workers/processing && bunx tsc --noEmit)
          (cd workers/mcp && bunx tsc --noEmit)
      - name: Lint
        working-directory: web
        run: bunx eslint .
      - name: Test
        working-directory: web
        run: bun test src
      - name: Worker tests
        working-directory: web
        run: bun run test:workers
      - name: Two-track bench
        working-directory: web
        run: bun bench/score.ts --check
      - name: Bundle workers
        run: |
          (cd workers/processing && bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/processing")
          (cd workers/mcp && bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/mcp")

  desktop:
    name: Desktop (Rust + Swift)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Prebuild
        run: desktop/scripts/prebuild.sh
      - name: Swift tests
        working-directory: desktop/swift-audio
        run: swift test
      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test --locked
