<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="/icon.svg"><title>Workspace export teaching fixture</title><style>body{font:18px system-ui;max-width:720px;margin:48px auto;padding:24px;background:#faf8f4;color:#292522}select,button{font:inherit;padding:12px;margin:8px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #bdb5ab;padding:15px}button:disabled{opacity:.45}a{color:#4b583b}</style></head><body><p>Fictional teaching fixture · not the Eavesy app</p><h1>Workspace export</h1><label for="workspace">Workspace</label><select id="workspace"><option>Alpha</option><option>Beta</option></select><table><caption>Exportable rows</caption><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody><tr><td>Pricing slide</td><td>Ready</td></tr><tr><td>Launch notes</td><td>Ready</td></tr></tbody></table><button id="export">Export</button><p role="status" id="status">Two rows are ready.</p><p><a href="/examples/narrated-ui-bug">Return to the worked example</a></p><script>document.querySelector('#workspace').addEventListener('change',()=>{document.querySelector('#export').disabled=true;document.querySelector('#status').textContent='Two rows remain ready, but Export is disabled. This is the deliberate demo defect.'});document.querySelector('#export').addEventListener('click',()=>{document.querySelector('#status').textContent='Export is available before switching workspaces.'});</script></body></html>
