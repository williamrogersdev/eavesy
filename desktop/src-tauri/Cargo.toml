[package]
name = "eavesy"
version = "0.5.5"
description = "Eavesy desktop shell"
authors = ["Eavesy contributors"]
license = "Apache-2.0"
publish = false
edition = "2021"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lib]
name = "eavesy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
base64 = "0.22"
libc = "0.2"
tauri = { version = "2.0", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-updater = "2.0"

window-vibrancy = "0.6"

rusqlite = { version = "0.31", features = ["bundled", "hooks"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
notify = "6.1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
png = "0.17"

tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std"] }
tracing-appender = "0.2"
regex = "1"

reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "multipart",
    "rustls-tls",
    "json",
] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "18ffb9a201fbf6fedfaa382fd4b92315ea30ab1a" }
security-framework = "3"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString", "NSError"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationSettings"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2.5"
wiremock = "0.6"
tauri = { version = "2.0", features = ["test"] }

[[example]]
name = "history-benchmark"
path = "../bench/history.rs"

# Legacy objc macros test this feature internally; it is not an app feature.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[[example]]
name = "next-performance"
path = "../bench/next-performance.rs"
