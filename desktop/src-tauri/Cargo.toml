[package]
name = "eavesy"
version = "0.1.9"
description = "Eavesy desktop shell"
authors = ["Eavesy contributors"]
license = "FSL-1.1-ALv2"
publish = false
edition = "2021"

[lib]
name = "eavesy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-updater = "2.0"

window-vibrancy = "0.6"

rusqlite = { version = "0.31", features = ["bundled"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
notify = "6.1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
png = "0.17"

sentry = { version = "0.48.5", default-features = false, features = [
    "backtrace",
    "debug-images",
    "panic",
    "reqwest",
    "rustls",
    "transport",
] }

reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "multipart",
    "rustls-tls",
    "json",
] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "18ffb9a201fbf6fedfaa382fd4b92315ea30ab1a" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2.5"
tauri = { version = "2.0", features = ["test"] }
