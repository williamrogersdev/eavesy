[package]
name="eavesy-next-benchmark"
version="0.1.0"
edition="2021"
publish=false
[profile.release]
lto="thin"
codegen-units=1
strip="debuginfo"
[[bin]]
name="next-performance"
path="../next-performance.rs"
[dependencies]
serde={version="=1.0.228",features=["derive"]}
serde_json="=1.0.150"
uuid={version="=1.24.0",features=["v4"]}
rusqlite={version="=0.31.0",features=["bundled","hooks"]}
regex="=1.13.1"
