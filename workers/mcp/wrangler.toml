name = "eavesy-mcp"
main = "src/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]
observability = { enabled = true, logs = { invocation_logs = false } }

routes = [
  { pattern = "mcp.example.invalid", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "eavesy"
database_id = "00000000-0000-0000-0000-000000000000"

[[vectorize]]
binding = "VECTORIZE"
index_name = "eavesy-embeddings"

[ai]
binding = "AI"

# Drops (send_to_my_devices): same bucket as the web app, and the web app's
# per-user DropsHub Durable Object for live delivery.
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "eavesy-audio"

[[durable_objects.bindings]]
name = "DROPS_HUB"
class_name = "DropsHub"
script_name = "eavesy"

# set_project queues the same cleaned-transcript rebuild as a move in the web app,
# and save_note queues webhook deliveries for the processing Worker to send.
[[queues.producers]]
queue = "eavesy-processing"
binding = "PROCESSING_QUEUE"
