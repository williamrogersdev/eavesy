name = "eavesy-mcp"
main = "src/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]
observability = { enabled = true, logs = { invocation_logs = false } }

routes = [
  { pattern = "mcp.example.invalid", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "eavesy"
database_id = "00000000-0000-0000-0000-000000000000"

[[vectorize]]
binding = "VECTORIZE"
index_name = "eavesy-embeddings"

[ai]
binding = "AI"
