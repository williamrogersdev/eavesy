[package]
name = "eavesy-bot"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Joins a Google Meet or Teams call in Chromium and streams its audio to Eavesy"
publish = false

[dependencies]
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "process", "sync", "signal", "io-util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
