name = "eavesy-processing"
main = "src/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]
observability = { enabled = true }

[[d1_databases]]
binding = "DB"
database_name = "eavesy"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "eavesy-audio"

[[vectorize]]
binding = "VECTORIZE"
index_name = "eavesy-embeddings"

[ai]
binding = "AI"

# Notetaker bots (workers/meeting-bot); deployed before this Worker.
[[services]]
binding = "MEETING_BOTS"
service = "eavesy-meeting-bot"
entrypoint = "BotControl"

[[queues.consumers]]
queue = "eavesy-processing"
max_batch_size = 1
max_batch_timeout = 5
# MAX_ATTEMPTS - 1 (web/src/server/processing/shared.ts): the consumer records
# the failure on the last delivery itself; the DLQ catches deliveries that crashed.
max_retries = 4
dead_letter_queue = "eavesy-processing-dlq"

[[queues.consumers]]
queue = "eavesy-processing-dlq"
max_batch_size = 1
max_batch_timeout = 5
# The DLQ has no DLQ of its own: past these attempts a message is dropped.
# Ten, five minutes apart (DEAD_LETTER_RETRY_SECONDS), ride out a D1 outage
# of most of an hour while still recording the failure.
max_retries = 10
retry_delay = 300

[[queues.producers]]
queue = "eavesy-processing"
binding = "PROCESSING_QUEUE"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MeetingRoom"]

[[migrations]]
tag = "v2"
deleted_classes = ["MeetingRoom"]

[triggers]
# Hourly sweeps; daily, the notetaker canary (web/src/server/meeting-bots/canary.ts, CANARY_CRON).
crons = ["0 * * * *", "20 7 * * *"]
